name=ESP32Drop
version=0.1.0
author=MIRO
maintainer=MIRO <mobilehackerz@gmail.com>
sentence=Receive AirDrop files on an ESP32-S3 by speaking Apple Wireless Direct Link.
paragraph=Receives files from a Mac or an iPhone that picks the device in the share sheet. The two ends connect directly: no pairing, no account, no access point. This tree receives only. Needs an ESP32-S3 with PSRAM, since a transfer is decoded there. TAKES THE RADIO EXCLUSIVELY: AWDL runs on 2.4 GHz channel 6 in step with the mesh availability window, so the interface cannot be shared with WiFi.begin(). Transmit timing runs on a dedicated high-priority task, so heavy work in loop() is fine. An independent re-implementation of AWDL and the AirDrop protocol, not affiliated with or endorsed by Apple Inc.
category=Communication
architectures=esp32
includes=ESP32Drop.h,ESP32AWDL.h
license=0BSD
